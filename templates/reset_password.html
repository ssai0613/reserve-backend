{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReServe — Set New Password</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-[#F4F8F6] min-h-screen flex items-center justify-center p-4 font-sans antialiased text-gray-900">
  <div class="bg-white rounded-3xl border border-gray-200 shadow-xl w-full max-w-md p-8 space-y-6">
    <div class="text-center space-y-2">
      <div class="mx-auto w-14 h-14 rounded-2xl bg-[#1B4D3E] text-white flex items-center justify-center shadow-md">
        <i data-lucide="key-round" class="w-7 h-7"></i>
      </div>
      <h1 class="text-2xl font-black text-[#1B4D3E] tracking-tight">Reset Your Password</h1>
      <p class="text-xs text-gray-500">
        Setting a new password for <span class="font-bold text-[#1B4D3E]">{{ email|default:"your RESERVE account" }}</span>
      </p>
    </div>

    <form id="resetPwForm" class="space-y-4">
      <input type="hidden" id="resetToken" value="{{ token }}">
      <div>
        <label class="block text-[11px] font-bold text-gray-700 mb-1.5">New Password *</label>
        <input type="password" id="newPassword" required minlength="6" placeholder="Enter new password"
          class="w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-xl text-xs font-semibold focus:outline-none focus:border-[#1B4D3E]">
      </div>
      <div>
        <label class="block text-[11px] font-bold text-gray-700 mb-1.5">Confirm New Password *</label>
        <input type="password" id="confirmPassword" required minlength="6" placeholder="Re-enter new password"
          class="w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-xl text-xs font-semibold focus:outline-none focus:border-[#1B4D3E]">
      </div>

      <div id="resetStatusBox" class="hidden rounded-xl p-3 text-xs font-bold"></div>

      <button type="submit" id="resetSubmitBtn"
        class="w-full bg-[#1B4D3E] hover:bg-[#143B2F] text-white font-black text-xs py-3.5 rounded-xl transition-all shadow-sm">
        UPDATE PASSWORD
      </button>
    </form>

    <div class="text-center pt-2 border-t border-gray-100">
      <a href="/login/" class="text-xs font-bold text-[#3A826D] hover:text-[#1B4D3E]">← Return to Login</a>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      if (window.lucide) lucide.createIcons();

      const form = document.getElementById('resetPwForm');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const token = document.getElementById('resetToken').value;
        const new_password = document.getElementById('newPassword').value;
        const confirm_password = document.getElementById('confirmPassword').value;
        const statusBox = document.getElementById('resetStatusBox');
        const btn = document.getElementById('resetSubmitBtn');

        statusBox.classList.add('hidden');
        if (new_password !== confirm_password) {
          statusBox.textContent = "Passwords do not match. Please check and try again.";
          statusBox.className = "rounded-xl p-3 text-xs font-bold bg-rose-50 text-rose-700 border border-rose-200";
          return;
        }

        btn.textContent = "UPDATING PASSWORD...";
        btn.disabled = true;

        try {
          const res = await fetch('/api/accounts/reset-password-confirm/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token, new_password, confirm_password })
          });
          const data = await res.json();
          if (res.ok) {
            statusBox.textContent = data.message || "Password updated successfully!";
            statusBox.className = "rounded-xl p-3 text-xs font-bold bg-emerald-50 text-emerald-800 border border-emerald-200";
            btn.textContent = "PASSWORD UPDATED ✓";
          } else {
            statusBox.textContent = data.error || "Could not reset password.";
            statusBox.className = "rounded-xl p-3 text-xs font-bold bg-rose-50 text-rose-700 border border-rose-200";
            btn.textContent = "UPDATE PASSWORD";
            btn.disabled = false;
          }
        } catch (err) {
          statusBox.textContent = "Network error while resetting password.";
          statusBox.className = "rounded-xl p-3 text-xs font-bold bg-rose-50 text-rose-700 border border-rose-200";
          btn.textContent = "UPDATE PASSWORD";
          btn.disabled = false;
        }
      });
    });
  </script>
</body>
</html>
